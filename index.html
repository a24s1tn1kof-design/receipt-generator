<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мой банк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  button, input, a, div, span {
    -webkit-tap-highlight-color: transparent;
  }

  button:focus, input:focus, a:focus {
    outline: none;
  }

  html, body {
    min-height: 100%;
    overscroll-behavior-y: auto;
  }

  body {
    font-family: 'Onest', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background-color: #050a08;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(40, 180, 90, 0.10) 0%, rgba(15, 70, 45, 0.05) 35%, transparent 65%),
      radial-gradient(circle at 50% 110%, rgba(0, 50, 35, 0.25) 0%, transparent 70%),
      linear-gradient(180deg, #07120e 0%, #030706 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    animation: fadeIn 0.3s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #screenForm {
    overflow-y: auto;
    overscroll-behavior: contain;
    width: 100%;
    padding: 20px 0;
  }

  #screenReceipt, #screenLoading, #screenCancelList {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  #screenLoading {
    gap: 22px;
  }
  .spinner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-top-color: #e8e8e8;
    border-right-color: rgba(232, 232, 232, 0.5);
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 15px;
    font-weight: 500;
    color: #b8b8b8;
    letter-spacing: -0.2px;
  }

  /* ===== Обёртка главной ===== */
  .main-wrap {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ===== Карта ===== */
  .bank-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1.586;
    border-radius: 22px;
    background:
      radial-gradient(circle at 15% 10%, rgba(46, 204, 113, 0.55) 0%, transparent 55%),
      radial-gradient(circle at 85% 95%, rgba(34, 211, 238, 0.35) 0%, transparent 60%),
      linear-gradient(135deg, #0e2b1d 0%, #08221a 45%, #051410 100%);
    padding: 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.55),
      0 0 60px rgba(33, 160, 56, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .bank-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg,
      rgba(255, 255, 255, 0.10) 0%,
      rgba(255, 255, 255, 0.02) 25%,
      transparent 45%);
    pointer-events: none;
  }
  .bank-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 2;
  }
  .bank-card .bank-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .bank-card .chip {
    width: 38px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, #e8d27a 0%, #c1a44a 50%, #f3e19b 100%);
    position: relative;
  }
  .bank-card .chip::before,
  .bank-card .chip::after {
    content: '';
    position: absolute;
    background: rgba(0, 0, 0, 0.15);
  }
  .bank-card .chip::before {
    top: 8px; left: 0; right: 0; height: 1px;
  }
  .bank-card .chip::after {
    bottom: 8px; left: 0; right: 0; height: 1px;
  }
  .bank-card .balance-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .bank-card .balance {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.8px;
    position: relative;
    z-index: 2;
  }
  .bank-card .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
    z-index: 2;
  }
  .bank-card .card-number {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
  }
  .bank-card .card-holder {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .bank-card .mir-logo {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.75);
  }

  /* ===== Кликер ===== */
  .clicker-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 4px 0 6px;
    position: relative;
  }
  .clicker-coin {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease;
    filter: drop-shadow(0 0 24px rgba(255, 200, 60, 0.35));
    -webkit-tap-highlight-color: transparent;
  }
  .clicker-coin:active {
    transform: scale(0.92);
  }
  .clicker-coin svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .clicker-hint {
    font-size: 12px;
    color: #6b6b6b;
    font-weight: 500;
    text-align: center;
  }

  .plus-popup {
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 800;
    color: #4ade80;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
  }
  .plus-popup.animate {
    animation: plusFly 0.9s ease-out forwards;
  }
  @keyframes plusFly {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1.15); }
  }

  /* ===== Управление ===== */
  .controls {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #101010;
    padding: 20px;
    border-radius: 22px;
    border: 1px solid #1c1c1c;
  }
  .controls h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: -0.3px;
  }
  .controls label {
    font-size: 13px;
    color: #8a8a8a;
    font-weight: 500;
  }
  .controls input {
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    -webkit-user-select: text;
    user-select: text;
  }
  .controls input:focus { border-color: #21a038; }
  .controls input::placeholder { color: #4a4a4a; }
  .controls button {
    background: #21a038;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    margin-top: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .controls button.ghost {
    background: transparent;
    color: #6b6b6b;
    border: 1px solid #262626;
    font-size: 13px;
    padding: 10px;
    font-weight: 400;
    margin-top: 0;
  }
  .controls button.admin-link {
    background: transparent;
    color: #ff3b30;
    border: none;
    font-size: 13px;
    padding: 10px;
    font-weight: 500;
    margin-top: 0;
    text-align: center;
  }
  .controls button.cancel-btn {
    background: #2a2a2a;
    color: #fff;
    font-size: 14px;
    padding: 13px;
    font-weight: 500;
  }
  .controls button:active { transform: scale(0.98); }

  .input-with-btn { display: flex; gap: 8px; }
  .input-with-btn button {
    padding: 0 14px;
    background: #1a1a1a;
    color: #fff;
    font-size: 18px;
    flex: 0 0 auto;
    margin-top: 0;
    border-radius: 12px;
    border: 1px solid #262626;
  }

  /* ===== Список отмены ===== */
  #screenCancelList {
    overflow-y: auto;
    overscroll-behavior: contain;
    width: 100%;
    padding: 20px 0;
  }
  .cancel-panel {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cancel-panel h2 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }
   .transfers-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .transfer-item {
    background: #141414;
    border: 1px solid #232323;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .transfer-item:hover { background: #1a1a1a; }
  .transfer-item.selected {
    border-color: #ff3b30;
    background: rgba(255, 59, 48, 0.08);
  }
  .transfer-item .info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
    text-align: left;
  }
  .transfer-item .info .name {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .transfer-item .info .amount {
    font-size: 13px;
    color: #8a8a8a;
    font-weight: 500;
  }
  .transfer-item .check-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #333;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .transfer-item.selected .check-circle {
    border-color: #ff3b30;
    background: #ff3b30;
    box-shadow: inset 0 0 0 3px #141414;
  }
  .empty-state {
    font-size: 14px;
    color: #6b6b6b;
    text-align: center;
    padding: 30px 10px;
  }
  .cancel-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .cancel-actions button {
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .cancel-actions .danger {
    background: #ff3b30;
    color: #fff;
  }
  .cancel-actions .danger:disabled {
    background: #3a1a18;
    color: #7a4a45;
    cursor: not-allowed;
  }
  .cancel-actions .back {
    background: transparent;
    color: #888;
    font-weight: 500;
  }
  .cancel-actions button:active:not(:disabled) { transform: scale(0.98); }

  /* ===== Чек ===== */
  .receipt-wrap {
    position: relative;
    width: 100%;
    max-width: 340px;
    border-radius: 28px;
    overflow: hidden;
    background: #0b0b0b;
    padding: 52px 22px 22px;
    text-align: center;
    border: 1px solid #151515;
    box-shadow: 0 0 80px rgba(33, 160, 56, 0.10);
  }

  .watermark {
    position: absolute;
    inset: -50%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-content: center;
    gap: 55px 25px;
    transform: rotate(-30deg);
    pointer-events: none;
    z-index: 1;
    opacity: 0.13;
  }
  .watermark.hidden { display: none; }
  .watermark span {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ff2d2d;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .receipt-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .check {
    width: 92px;
    height: 92px;
    margin: 0 auto 26px;
    display: block;
  }
  .check path {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw 0.7s ease forwards 0.1s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: -0.4px;
    color: #fff;
    text-align: center;
    width: 100%;
  }
  .title.cancelled { color: #ff3b30; }

  .amount {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -1.2px;
    color: #fff;
    line-height: 1.15;
    text-align: center;
    width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .amount.cancelled {
    color: #ff3b30;
    text-decoration: line-through;
    text-decoration-thickness: 3px;
  }
  .amount.custom-text {
    font-size: 30px;
    letter-spacing: -0.5px;
  }

  .commission {
    font-size: 15px;
    color: #8a8a8a;
    margin-bottom: 2px;
    font-weight: 500;
    text-align: center;
    width: 100%;
  }
  .recipient {
    font-size: 15px;
    color: #6b6b6b;
    margin-bottom: 22px;
    word-break: break-word;
    font-weight: 500;
    text-align: center;
    width: 100%;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    width: 100%;
  }
  .btn {
    flex: 1 1 0;
    min-width: 0;
    background: #1c1c1c;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 15px 8px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    white-space: nowrap;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: #232323; }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .btn-main {
    width: 100%;
    background: #fff;
    color: #000;
    font-weight: 600;
    font-family: inherit;
    padding: 16px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main:active { transform: scale(0.98); opacity: 0.9; }

  /* ===== Модалки ===== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #111;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: inherit;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal input {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .modal input:focus { border-color: #21a038; }
  .modal button {
    background: #21a038;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal button.cancel {
    background: transparent;
    color: #888;
    font-weight: 400;
  }
  .modal button.secondary-btn {
    background: #2a2a2a;
    color: #fff;
    font-weight: 500;
  }
  .modal .err { color: #ff5555; font-size: 13px; min-height: 16px; }
  .modal .ok { color: #21a038; font-size: 13px; min-height: 16px; }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c1c1c;
    padding: 14px;
    border-radius: 12px;
  }
  .toggle-row span { font-size: 14px; }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    background: #333;
    border-radius: 13px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .switch.on { background: #21a038; }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch.on::after { left: 23px; }

  .alert-modal {
    text-align: center;
    align-items: center;
    gap: 14px;
  }
  .alert-icon {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .alert-text {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    line-height: 1.4;
  }
  .alert-modal button {
    width: 100%;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="screen active" id="screenForm">
    <div class="main-wrap">

      <div class="bank-card">
        <div class="top-row">
          <div class="bank-name">CbeрБанк</div>
          <div class="chip"></div>
        </div>

        <div>
          <div class="balance-label">Доступно</div>
          <div class="balance" id="cardBalance">0 ₽</div>
        </div>

        <div class="card-footer">
          <div>
            <div class="card-number">**** 4571</div>
            <div class="card-holder">ARSENIY K.</div>
          </div>
          <div class="mir-logo">МИР</div>
        </div>
      </div>

      <div class="clicker-zone" id="clickerZone">
        <div class="plus-popup" id="plusPopup">+1 000</div>
        <button class="clicker-coin" onclick="tapCoin()" id="coinBtn" title="Тапнуть">
          <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="coinFace" cx="0.35" cy="0.30" r="0.85">
                <stop offset="0%"  stop-color="#ffe37a"/>
                <stop offset="45%" stop-color="#f5c842"/>
                <stop offset="100%" stop-color="#b8860b"/>
              </radialGradient>
              <radialGradient id="coinRim" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%"   stop-color="#f0d060"/>
                <stop offset="80%"  stop-color="#a9741e"/>
                <stop offset="100%" stop-color="#7a5312"/>
              </radialGradient>
              <linearGradient id="coinShine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
                <stop offset="45%"  stop-color="rgba(255,255,255,0.05)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.35)"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="58" fill="url(#coinRim)"/>
            <circle cx="60" cy="60" r="50" fill="url(#coinFace)"/>
            <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(122,83,18,0.55)" stroke-width="1.5" stroke-dasharray="3 4"/>
            <circle cx="60" cy="60" r="50" fill="url(#coinShine)"/>
            <text x="60" y="80" text-anchor="middle" font-family="Onest, sans-serif" font-size="52" font-weight="900" fill="#7a5312">₽</text>
          </svg>
        </button>
        <div class="clicker-hint">Тапни по монете — получишь 1 000 ₽</div>
      </div>

      <div class="controls">
        <h2>Новый перевод</h2>

        <label>Сумма (₽)</label>
        <input id="amountInput" type="text" inputmode="numeric" placeholder="Введите сумму">

        <label>Получатель</label>
        <div class="input-with-btn">
          <input id="recipientInput" type="text" placeholder="Введите имя">
          <button onclick="randomRecipient()" title="Случайный получатель">🎲</button>
        </div>

        <label>Комиссия (₽)</label>
        <input id="commissionInput" type="text" inputmode="numeric" placeholder="Введите комиссию">

        <button onclick="submitTransfer()">Перевести</button>
        <button class="cancel-btn" onclick="openCancelList()">Отменить перевод</button>
        <button class="admin-link" onclick="openAdmin()">⚙ Админ-панель</button>
      </div>

    </div>
  </div>

  <div class="screen" id="screenLoading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Отправляем перевод...</div>
  </div>

  <div class="screen" id="screenCancelList">
    <div class="cancel-panel">
      <h2>Мои переводы</h2>
      <div class="transfers-list" id="transfersList"></div>
      <div class="cancel-actions">
        <button class="danger" id="cancelActionBtn" onclick="confirmCancel()" disabled>ОТМЕНИТЬ ПЕРЕВОД</button>
        <button class="back" onclick="backToForm()">На главный</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screenReceipt">
    <div class="receipt-wrap" id="receipt">
      <div class="watermark" id="watermark"></div>

      <div class="receipt-content">
        <svg class="check" viewBox="0 0 100 100" id="checkIcon">
          <defs>
            <linearGradient id="grad" x1="0.15" y1="0.65" x2="0.85" y2="0.25">
              <stop offset="0%"   stop-color="#d4f24a"/>
              <stop offset="35%"  stop-color="#7ee34a"/>
              <stop offset="65%"  stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <path d="M20 50 L40 72 L82 22"
                fill="none"
                stroke="url(#grad)"
                stroke-width="20"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>

        <div class="title" id="receiptTitle">Перевод доставлен</div>
        <div class="amount" id="amountView">— ₽</div>
        <div class="commission" id="commissionView">Комиссия — ₽</div>
        <div class="recipient" id="recipientView">—</div>

        <div class="row" id="receiptRow">
          <button class="btn" onclick="downloadPNG()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="13" y2="17"/>
            </svg>
            Чек
          </button>
          <button class="btn" onclick="backToForm()">Автоперевод</button>
        </div>
        <button class="btn-main" onclick="backToForm()">На главный</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="loginModal">
    <div class="modal">
      <h3>Вход в админ-панель</h3>
      <input id="passInput" type="password" placeholder="Пароль" autocomplete="off">
      <div class="err" id="loginErr"></div>
      <button onclick="tryLogin()">Войти</button>
      <button class="cancel" onclick="closeModal('loginModal')">Отмена</button>
    </div>
  </div>

  <div class="modal-bg" id="adminModal">
    <div class="modal">
      <h3>Настройки</h3>
      <div class="toggle-row">
        <span>Вотермарка «ФЕЙК»</span>
        <div class="switch on" id="wmSwitch" onclick="toggleWatermark()"></div>
      </div>
      <div class="ok" id="adminMsg"></div>
      <button class="secondary-btn" onclick="openCustomReceipt()">Выдать чек вручную</button>
      <button class="secondary-btn" onclick="openGiveMoney()">Выдать деньги</button>
      <button class="secondary-btn" onclick="resetBalance()">Обнулить баланс</button>
      <button onclick="closeModal('adminModal')">Готово</button>
      <button class="cancel" onclick="logout()">Выйти из админа</button>
    </div>
  </div>

  <div class="modal-bg" id="customModal">
    <div class="modal">
      <h3>Чек вручную</h3>
      <input id="customAmountInput" type="text" placeholder="Текст вместо суммы">
      <input id="customRecipientInput" type="text" placeholder="Получатель">
      <input id="customCommissionInput" type="text" placeholder="Комиссия (необязательно)">
      <div class="err" id="customErr"></div>
      <button onclick="showCustomReceipt()">Показать чек</button>
      <button class="cancel" onclick="closeModal('customModal')">Отмена</button>
    </div>
  </div>

  <div class="modal-bg" id="giveMoneyModal">
    <div class="modal">
      <h3>Выдать деньги</h3>
      <input id="giveMoneyInput" type="text" inputmode="numeric" placeholder="Сумма (₽)">
      <div class="err" id="giveMoneyErr"></div>
      <button onclick="doGiveMoney()">Выдать</button>
      <button class="cancel" onclick="closeModal('giveMoneyModal')">Отмена</button>
    </div>
  </div>

  <div class="modal-bg" id="alertModal">
    <div class="modal alert-modal">
      <div class="alert-icon">⚠️</div>
      <div class="alert-text" id="alertText">Введите сумму больше 0</div>
      <button onclick="closeModal('alertModal')">OK</button>
    </div>
  </div>
  <script>
  const ADMIN_PASSWORD = "Arseniy3412";
  const STORAGE_KEY = "bank_balance_v1";
  const STORAGE_TRANSFERS = "bank_transfers_v1";

  const NAMES = [
    "Светлана Анатольевна З.",
    "Иван Петрович С.",
    "Мария Ивановна К.",
    "Дмитрий Александрович В.",
    "Ольга Сергеевна М.",
    "Артём Николаевич Р.",
    "Екатерина Дмитриевна Л.",
    "Алексей Владимирович Т.",
    "Наталья Юрьевна Б.",
    "Сергей Андреевич Ф.",
    "Виктория Олеговна Ш.",
    "Максим Игоревич П.",
    "Анна Викторовна Г.",
    "Павел Денисович Н.",
    "Татьяна Юрьевна О.",
    "Ситников Матвей А."
  ];

  let isAdmin = false;
  let watermarkEnabled = true;
  let transfers = [];
  let selectedTransferIndex = null;
  let balance = 0;

  /* ===== Числа ===== */
  function formatNumber(value) {
    const digits = String(value).replace(/\D/g, '');
    if (!digits) return '';
    return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function unformatNumber(value) {
    return String(value).replace(/\s/g, '');
  }

  /* ===== Хранилище ===== */
  function loadState() {
    try {
      const b = localStorage.getItem(STORAGE_KEY);
      if (b !== null) balance = Number(b) || 0;

      const t = localStorage.getItem(STORAGE_TRANSFERS);
      if (t) transfers = JSON.parse(t) || [];
    } catch (e) {
      balance = 0;
      transfers = [];
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, String(balance));
      localStorage.setItem(STORAGE_TRANSFERS, JSON.stringify(transfers));
    } catch (e) {}
  }

  function updateCardBalance() {
    document.getElementById('cardBalance').textContent =
      formatNumber(balance) + ' ₽';
  }

  /* ===== Вибрация и модалка ===== */
  function vibrate(pattern) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) {}
    }
  }

  function showAlert(text) {
    document.getElementById('alertText').textContent = text;
    document.getElementById('alertModal').classList.add('show');
  }

  /* ===== Блокировки скролла на чеке ===== */
  let touchStartX = 0;
  let touchStartY = 0;

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    const active =
      document.getElementById('screenReceipt').classList.contains('active') ||
      document.getElementById('screenLoading').classList.contains('active');
    if (!active) return;
    if (e.touches.length !== 1) return;

    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    const dy = Math.abs(e.touches[0].clientY - touchStartY);

    if (dx > dy && dx > 10) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('wheel', (e) => {
    if (document.getElementById('screenReceipt').classList.contains('active')) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('screenReceipt').classList.contains('active')) {
      const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
      if (keys.includes(e.key)) e.preventDefault();
    }
  });

  function initWatermark() {
    const wm = document.getElementById('watermark');
    wm.innerHTML = '';
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.textContent = 'ФЕЙК';
      wm.appendChild(s);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen')
      .forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ===== Кликер ===== */
  function tapCoin() {
    balance += 1000;
    saveState();
    updateCardBalance();
    vibrate(15);

    /* Плюс-попап над монетой */
    const popup = document.getElementById('plusPopup');
    popup.classList.remove('animate');
    void popup.offsetWidth;
    popup.classList.add('animate');

    /* Пульс карты */
    const card = document.querySelector('.bank-card');
    card.style.transition = 'transform 0.12s ease';
    card.style.transform = 'scale(1.015)';
    setTimeout(() => {
      card.style.transform = 'scale(1)';
    }, 120);
  }

  /* ===== Чек ===== */
  function showReceipt(data, cancelled, isCustom) {
    const amountEl = document.getElementById('amountView');
    const title = document.getElementById('receiptTitle');
    const checkIcon = document.getElementById('checkIcon');
    const row = document.getElementById('receiptRow');

    amountEl.classList.remove('cancelled', 'custom-text');
    title.classList.remove('cancelled');

    if (isCustom && !cancelled) {
      amountEl.textContent = data.amount;
      amountEl.classList.add('custom-text');
    } else {
      amountEl.textContent = formatNumber(data.amount) + ' ₽';
    }

    document.getElementById('commissionView').textContent =
      'Комиссия ' + (data.commission === '' ? '0' : formatNumber(data.commission)) + ' ₽';
    document.getElementById('recipientView').textContent = data.recipient;

    if (cancelled) {
      title.textContent = 'Перевод отменён';
      title.classList.add('cancelled');
      amountEl.classList.add('cancelled');
      row.style.display = 'none';
      checkIcon.innerHTML = `
        <defs>
          <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6b5b"/>
            <stop offset="100%" stop-color="#ff3b30"/>
          </linearGradient>
        </defs>
        <path d="M30 30 L70 70 M70 30 L30 70"
              fill="none"
              stroke="url(#gradRed)"
              stroke-width="18"
              stroke-linecap="round"
              stroke-linejoin="round"/>`;
    } else {
      title.textContent = 'Перевод доставлен';
      row.style.display = 'flex';
      checkIcon.innerHTML = `
        <defs>
          <linearGradient id="grad" x1="0.15" y1="0.65" x2="0.85" y2="0.25">
            <stop offset="0%"   stop-color="#d4f24a"/>
            <stop offset="35%"  stop-color="#7ee34a"/>
            <stop offset="65%"  stop-color="#22c55e"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <path d="M20 50 L40 72 L82 22"
              fill="none"
              stroke="url(#grad)"
              stroke-width="20"
              stroke-linecap="round"
              stroke-linejoin="round"/>`;
    }

    const checkPath = checkIcon.querySelector('path');
    checkPath.style.animation = 'none';
    void checkPath.offsetWidth;
    checkPath.style.animation = 'draw 0.7s ease forwards 0.1s';

    showScreen('screenReceipt');
  }

  /* ===== Перевод ===== */
  function submitTransfer() {
    const amountRaw = unformatNumber(document.getElementById('amountInput').value);
    const recipient = document.getElementById('recipientInput').value.trim();
    const commissionRaw = unformatNumber(document.getElementById('commissionInput').value);

    if (!amountRaw || Number(amountRaw) <= 0) {
      vibrate([30, 40, 30]);
      showAlert('Введите сумму больше 0');
      return;
    }
    if (!recipient) {
      vibrate([30, 40, 30]);
      showAlert('Введите получателя');
      return;
    }
    if (Number(amountRaw) > balance) {
      vibrate([30, 40, 30]);
      showAlert('Недостаточно средств на карте');
      return;
    }

    vibrate(20);
    document.getElementById('loadingText').textContent = 'Отправляем перевод...';
    showScreen('screenLoading');

    setTimeout(() => {
      /* Списываем деньги */
      balance -= Number(amountRaw);
      saveState();
      updateCardBalance();

      const data = {
        amount: amountRaw,
        recipient: recipient,
        commission: commissionRaw
      };

      transfers.push({
        amount: amountRaw,
        recipient: recipient,
        commission: commissionRaw,
        cancelled: false
      });
      saveState();

      vibrate([50, 60, 50, 60, 80]);
      showReceipt(data, false, false);
    }, 1500);
  }

  /* ===== Отмена ===== */
  function openCancelList() {
    vibrate(20);
    selectedTransferIndex = null;
    renderTransfersList();
    updateCancelBtn();
    showScreen('screenCancelList');
  }

  function renderTransfersList() {
    const list = document.getElementById('transfersList');
    list.innerHTML = '';

    if (transfers.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Пока нет ни одного перевода';
      list.appendChild(empty);
      return;
    }

    transfers.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'transfer-item';
      if (i === selectedTransferIndex) item.classList.add('selected');

      item.innerHTML = `
        <div class="info">
          <div class="name">${t.recipient}</div>
          <div class="amount">${formatNumber(t.amount)} ₽${t.cancelled ? ' · отменён' : ''}</div>
        </div>
        <div class="check-circle"></div>`;

      item.onclick = () => {
        vibrate(15);
        if (t.cancelled) {
          showAlert('Этот перевод уже отменён');
          return;
        }
        selectedTransferIndex = i;
        renderTransfersList();
        updateCancelBtn();
      };

      list.appendChild(item);
    });
  }

  function updateCancelBtn() {
    const btn = document.getElementById('cancelActionBtn');
    btn.disabled = selectedTransferIndex === null;
  }

  function confirmCancel() {
    if (selectedTransferIndex === null) return;
    const t = transfers[selectedTransferIndex];

    vibrate(30);
    document.getElementById('loadingText').textContent = 'Отменяем операцию...';
    showScreen('screenLoading');

    setTimeout(() => {
      t.cancelled = true;

      /* Возвращаем деньги обратно */
      balance += Number(t.amount);
      saveState();
      updateCardBalance();

      vibrate([80, 40, 80]);
      showReceipt({
        amount: t.amount,
        recipient: t.recipient,
        commission: t.commission
      }, true, false);
      selectedTransferIndex = null;
    }, 1500);
  }

  function backToForm() {
    showScreen('screenForm');
  }

  function randomRecipient() {
    vibrate(20);
    const el = document.getElementById('recipientInput');
    let next, attempts = 0;
    do {
      next = NAMES[Math.floor(Math.random() * NAMES.length)];
      attempts++;
    } while (next === el.value && NAMES.length > 1 && attempts < 20);
    el.value = next;
  }

  /* ===== Админка ===== */
  function openAdmin() {
    vibrate(20);
    if (isAdmin) {
      document.getElementById('adminModal').classList.add('show');
      return;
    }
    document.getElementById('loginErr').textContent = '';
    document.getElementById('passInput').value = '';
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('passInput').focus(), 60);
  }

  function tryLogin() {
    const val = document.getElementById('passInput').value;
    const err = document.getElementById('loginErr');

    if (!val) {
      err.textContent = 'Введите пароль';
      return;
    }

    if (val === ADMIN_PASSWORD) {
      vibrate([40, 40, 60]);
      isAdmin = true;
      err.textContent = '';
      closeModal('loginModal');
      document.getElementById('adminModal').classList.add('show');
    } else {
      vibrate([80, 40, 80]);
      err.textContent = 'Неверный пароль';
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  function toggleWatermark() {
    vibrate(20);
    watermarkEnabled = !watermarkEnabled;
    const sw = document.getElementById('wmSwitch');
    sw.classList.toggle('on', watermarkEnabled);
    document.getElementById('watermark')
      .classList.toggle('hidden', !watermarkEnabled);
    document.getElementById('adminMsg').textContent =
      watermarkEnabled ? 'Вотермарка включена' : 'Вотермарка выключена';
  }

  /* ===== Чек вручную ===== */
  function openCustomReceipt() {
    vibrate(20);
    document.getElementById('customAmountInput').value = '';
    document.getElementById('customRecipientInput').value = '';
    document.getElementById('customCommissionInput').value = '';
    document.getElementById('customErr').textContent = '';
    closeModal('adminModal');
    document.getElementById('customModal').classList.add('show');
    setTimeout(() => document.getElementById('customAmountInput').focus(), 60);
  }

  function showCustomReceipt() {
    const amountText = document.getElementById('customAmountInput').value.trim();
    const recipient = document.getElementById('customRecipientInput').value.trim();
    const commissionRaw = unformatNumber(document.getElementById('customCommissionInput').value);
    const err = document.getElementById('customErr');

    if (!amountText) {
      err.textContent = 'Введите текст вместо суммы';
      return;
    }
    if (!recipient) {
      err.textContent = 'Введите получателя';
      return;
    }

    err.textContent = '';
    vibrate([50, 60, 50, 60, 80]);
    closeModal('customModal');

    showReceipt({
      amount: amountText,
      recipient: recipient,
      commission: commissionRaw === '' ? '0' : commissionRaw
    }, false, true);
  }

  /* ===== Выдать деньги ===== */
  function openGiveMoney() {
    vibrate(20);
    document.getElementById('giveMoneyInput').value = '';
    document.getElementById('giveMoneyErr').textContent = '';
    closeModal('adminModal');
    document.getElementById('giveMoneyModal').classList.add('show');
    setTimeout(() => document.getElementById('giveMoneyInput').focus(), 60);
  }

  function doGiveMoney() {
    const raw = unformatNumber(document.getElementById('giveMoneyInput').value);
    const err = document.getElementById('giveMoneyErr');

    if (!raw || Number(raw) <= 0) {
      err.textContent = 'Введите сумму больше 0';
      return;
    }

    err.textContent = '';
    balance += Number(raw);
    saveState();
    updateCardBalance();
    vibrate([40, 40, 60]);
    closeModal('giveMoneyModal');
  }

  /* ===== Обнулить баланс ===== */
  function resetBalance() {
    vibrate([60, 40, 60]);
    balance = 0;
    saveState();
    updateCardBalance();
    document.getElementById('adminMsg').textContent = 'Баланс обнулён';
  }

  function logout() {
    vibrate(20);
    isAdmin = false;
    closeModal('adminModal');
  }

  /* ===== Скачать PNG ===== */
  async function downloadPNG() {
    vibrate(30);
    const node = document.getElementById('receipt');
    const rect = node.getBoundingClientRect();
    const scale = 3;

    const canvas = document.createElement('canvas');
    canvas.width = rect.width * scale;
    canvas.height = rect.height * scale;

    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#0b0b0b';
    ctx.fillRect(0, 0, rect.width, rect.height);

    if (watermarkEnabled) {
      ctx.save();
      ctx.translate(rect.width / 2, rect.height / 2);
      ctx.rotate(-30 * Math.PI / 180);
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = '#ff2d2d';
      ctx.font = '900 22px Onest, sans-serif';
      ctx.textAlign = 'center';
      for (let y = -rect.height; y < rect.height; y += 80) {
        for (let x = -rect.width; x < rect.width; x += 150) {
          ctx.fillText('ФЕЙК', x, y);
        }
      }
      ctx.restore();
    }

    const isCancelled = document.getElementById('receiptTitle').classList.contains('cancelled');
    const isCustom = document.getElementById('amountView').classList.contains('custom-text');

    if (isCancelled) {
      const gradRed = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      gradRed.addColorStop(0, '#ff6b5b');
      gradRed.addColorStop(1, '#ff3b30');
      ctx.strokeStyle = gradRed;
    } else {
      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0,    '#d4f24a');
      grad.addColorStop(0.35, '#7ee34a');
      grad.addColorStop(0.65, '#22c55e');
      grad.addColorStop(1,    '#22d3ee');
      ctx.strokeStyle = grad;
    }

    ctx.lineWidth = isCancelled ? 18 : 20;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const cx = rect.width / 2;
    const cy = 52 + 46;
    const s = 92 / 100;

    ctx.beginPath();
    if (isCancelled) {
      ctx.moveTo(cx + (30 - 50) * s, cy + (30 - 50) * s);
      ctx.lineTo(cx + (70 - 50) * s, cy + (70 - 50) * s);
      ctx.moveTo(cx + (70 - 50) * s, cy + (30 - 50) * s);
      ctx.lineTo(cx + (30 - 50) * s, cy + (70 - 50) * s);
    } else {
      ctx.moveTo(cx + (20 - 50) * s, cy + (50 - 50) * s);
      ctx.lineTo(cx + (40 - 50) * s, cy + (72 - 50) * s);
      ctx.lineTo(cx + (82 - 50) * s, cy + (22 - 50) * s);
    }
    ctx.stroke();

    ctx.textAlign = 'center';

    if (isCancelled) {
      ctx.fillStyle = '#ff3b30';
      ctx.font = '700 22px Onest, sans-serif';
      ctx.fillText('Перевод отменён', cx, cy + 82);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = '700 22px Onest, sans-serif';
      ctx.fillText('Перевод доставлен', cx, cy + 82);
    }

    ctx.fillStyle = isCancelled ? '#ff3b30' : '#fff';
    ctx.font = isCustom ? '800 30px Onest, sans-serif' : '800 42px Onest, sans-serif';
    ctx.fillText(
      document.getElementById('amountView').textContent,
      cx, cy + 134
    );

    ctx.fillStyle = '#8a8a8a';
    ctx.font = '500 15px Onest, sans-serif';
    ctx.fillText(
      document.getElementById('commissionView').textContent,
      cx, cy + 162
    );

    ctx.fillStyle = '#6b6b6b';
    ctx.fillText(
      document.getElementById('recipientView').textContent,
      cx, cy + 184
    );

    const link = document.createElement('a');
    link.download = 'receipt.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  /* ===== Инициализация ===== */
  document.addEventListener('DOMContentLoaded', () => {
    initWatermark();
    loadState();
    updateCardBalance();

    const amountInput = document.getElementById('amountInput');
    const commissionInput = document.getElementById('commissionInput');

    amountInput.addEventListener('input', () => {
      const cursorEnd = amountInput.selectionStart === amountInput.value.length;
      amountInput.value = formatNumber(amountInput.value);
      if (cursorEnd) amountInput.setSelectionRange(amountInput.value.length, amountInput.value.length);
    });

    commissionInput.addEventListener('input', () => {
      const cursorEnd = commissionInput.selectionStart === commissionInput.value.length;
      commissionInput.value = formatNumber(commissionInput.value);
      if (cursorEnd) commissionInput.setSelectionRange(commissionInput.value.length, commissionInput.value.length);
    });

    document.getElementById('passInput')
      .addEventListener('keydown', e => {
        if (e.key === 'Enter') tryLogin();
      });

    document.querySelectorAll('.modal-bg').forEach(bg => {
      bg.addEventListener('click', e => {
        if (e.target === bg) bg.classList.remove('show');
      });
    });

    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouch <= 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
  });
</script>

</body>
