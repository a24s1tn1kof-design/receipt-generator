<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевод доставлен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Onest', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background-color: #07130e;
    background-image:
      radial-gradient(circle at 50% 42%, rgba(45, 200, 90, 0.20) 0%, rgba(20, 90, 55, 0.10) 30%, transparent 62%),
      radial-gradient(circle at 50% 105%, rgba(0, 70, 45, 0.40) 0%, transparent 70%),
      linear-gradient(180deg, #0a1a15 0%, #050a08 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Экраны ===== */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    animation: fadeIn 0.3s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Форма ===== */
  .controls {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #101010;
    padding: 20px;
    border-radius: 22px;
    border: 1px solid #1c1c1c;
  }
  .controls h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: -0.3px;
  }
  .controls label {
    font-size: 13px;
    color: #8a8a8a;
    font-weight: 500;
  }
  .controls input {
    background: #1a1a1a;
    border: 1px solid #262626;
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .controls input:focus { border-color: #21a038; }
  .controls button {
    background: #21a038;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    margin-top: 4px;
  }
  .controls button.ghost {
    background: transparent;
    color: #6b6b6b;
    border: 1px solid #262626;
    font-size: 13px;
    padding: 10px;
    font-weight: 400;
    margin-top: 0;
  }
  .controls button:active { transform: scale(0.98); }

  .input-with-btn { display: flex; gap: 8px; }
  .input-with-btn button {
    padding: 0 14px;
    background: #1a1a1a;
    color: #fff;
    font-size: 18px;
    flex: 0 0 auto;
    margin-top: 0;
    border-radius: 12px;
    border: 1px solid #262626;
  }

  /* ===== Карточка чека ===== */
  .receipt-wrap {
    position: relative;
    width: 100%;
    max-width: 340px;
    border-radius: 24px;
    overflow: hidden;
    background: #0d0d0d;
    padding: 46px 24px 24px;
    text-align: center;
    border: 1px solid #171717;
    box-shadow: 0 0 100px rgba(33, 160, 56, 0.18);
  }

  .watermark {
    position: absolute;
    inset: -50%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-content: center;
    gap: 55px 25px;
    transform: rotate(-30deg);
    pointer-events: none;
    z-index: 1;
    opacity: 0.13;
  }
  .watermark.hidden { display: none; }
  .watermark span {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ff2d2d;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .receipt-content { position: relative; z-index: 2; }

  /* Галочка */
  .check {
    width: 110px;
    height: 110px;
    margin: 0 auto 22px;
    display: block;
  }
  .check path {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: draw 0.7s ease forwards 0.1s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Заголовок */
  .title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 18px;
    letter-spacing: -0.5px;
    color: #fff;
  }

  /* Сумма */
  .amount {
    font-size: 46px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -1.5px;
    color: #fff;
    line-height: 1;
  }

  /* Комиссия и получатель */
  .commission {
    font-size: 15px;
    color: #8a8a8a;
    margin-bottom: 3px;
    font-weight: 500;
  }
  .recipient {
    font-size: 15px;
    color: #6b6b6b;
    margin-bottom: 26px;
    word-break: break-word;
    font-weight: 500;
  }

  /* Кнопки в ряд */
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .btn {
    flex: 1;
    background: #1c1c1c;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 15px 10px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  .btn:hover { background: #232323; }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Главная кнопка */
  .btn-main {
    width: 100%;
    background: #fff;
    color: #000;
    font-weight: 600;
    font-family: inherit;
    padding: 17px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn-main:active { transform: scale(0.98); opacity: 0.9; }

  /* ===== Модалки ===== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #111;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: inherit;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal input {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .modal input:focus { border-color: #21a038; }
  .modal button {
    background: #21a038;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .modal button.cancel {
    background: transparent;
    color: #888;
    font-weight: 400;
  }
  .modal .err { color: #ff5555; font-size: 13px; min-height: 16px; }
  .modal .ok { color: #21a038; font-size: 13px; min-height: 16px; }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c1c1c;
    padding: 14px;
    border-radius: 12px;
  }
  .toggle-row span { font-size: 14px; }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    background: #333;
    border-radius: 13px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
  }
  .switch.on { background: #21a038; }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch.on::after { left: 23px; }
</style>
</head>
<body>

  <!-- ===== ЭКРАН 1: ФОРМА ===== -->
  <div class="screen active" id="screenForm">
    <div class="controls">
      <h2>Новый перевод</h2>

      <label>Сумма (₽)</label>
      <input id="amountInput" type="number" value="37" placeholder="37">

      <label>Получатель</label>
      <div class="input-with-btn">
        <input id="recipientInput" type="text" value="Светлана Анатольевна З." placeholder="Имя">
        <button onclick="randomRecipient()" title="Случайный получатель">🎲</button>
      </div>

      <label>Комиссия (₽)</label>
      <input id="commissionInput" type="number" value="0" placeholder="0">

      <button onclick="submitTransfer()">Перевести</button>
      <button class="ghost" onclick="openAdmin()">⚙ Админ-панель</button>
    </div>
  </div>

  <!-- ===== ЭКРАН 2: ЧЕК ===== -->
  <div class="screen" id="screenReceipt">
    <div class="receipt-wrap" id="receipt">
      <div class="watermark" id="watermark"></div>

      <div class="receipt-content">
        <svg class="check" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="grad" x1="0.05" y1="0.55" x2="0.85" y2="0.15">
              <stop offset="0%"   stop-color="#c6f542"/>
              <stop offset="25%"  stop-color="#7ee34a"/>
              <stop offset="55%"  stop-color="#22c55e"/>
              <stop offset="80%"  stop-color="#22d3ee"/>
              <stop offset="100%" stop-color="#22b8e8"/>
            </linearGradient>
          </defs>
          <path d="M22 54 L42 74 L80 30"
                fill="none"
                stroke="url(#grad)"
                stroke-width="15"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>

        <div class="title">Перевод доставлен</div>
        <div class="amount" id="amountView">37 ₽</div>
        <div class="commission" id="commissionView">Комиссия 0 ₽</div>
        <div class="recipient" id="recipientView">Светлана Анатольевна З.</div>

        <div class="row">
          <button class="btn" onclick="downloadPNG()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="13" y2="17"/>
            </svg>
            Чек
          </button>
          <button class="btn" onclick="backToForm()">Автоперевод</button>
        </div>
        <button class="btn-main" onclick="backToForm()">На главный</button>
      </div>
    </div>
  </div>

  <!-- ===== МОДАЛКИ ===== -->
  <div class="modal-bg" id="loginModal">
    <div class="modal">
      <h3>Вход в админ-панель</h3>
      <input id="passInput" type="password" placeholder="Пароль" autocomplete="off">
      <div class="err" id="loginErr"></div>
      <button onclick="tryLogin()">Войти</button>
      <button class="cancel" onclick="closeModal('loginModal')">Отмена</button>
    </div>
  </div>

  <div class="modal-bg" id="adminModal">
    <div class="modal">
      <h3>Настройки</h3>
      <div class="toggle-row">
        <span>Вотермарка «ФЕЙК»</span>
        <div class="switch on" id="wmSwitch" onclick="toggleWatermark()"></div>
      </div>
      <div class="ok" id="adminMsg"></div>
      <button onclick="closeModal('adminModal')">Готово</button>
      <button class="cancel" onclick="logout()">Выйти из админа</button>
    </div>
 </div>
 <script>
  /* ===== Пароль админки ===== */
  const ADMIN_PASSWORD = "Arseniy3412";

  const NAMES = [
    "Светлана Анатольевна З.",
    "Иван Петрович С.",
    "Мария Ивановна К.",
    "Дмитрий Александрович В.",
    "Ольга Сергеевна М.",
    "Артём Николаевич Р.",
    "Екатерина Дмитриевна Л.",
    "Алексей Владимирович Т.",
    "Наталья Юрьевна Б.",
    "Сергей Андреевич Ф.",
    "Виктория Олеговна Ш.",
    "Максим Игоревич П.",
    "Анна Викторовна Г.",
    "Павел Денисович Н.",
    "Татьяна Юрьевна О.",
    "Ситников Матвей А."
  ];

  let isAdmin = false;
  let watermarkEnabled = true;

  function initWatermark() {
    const wm = document.getElementById('watermark');
    wm.innerHTML = '';
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.textContent = 'ФЕЙК';
      wm.appendChild(s);
    }
  }

  /* ===== Переключение экранов ===== */
  function showScreen(id) {
    document.querySelectorAll('.screen')
      .forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ===== Форма → чек ===== */
  function submitTransfer() {
    const amount = document.getElementById('amountInput').value || 0;
    const recipient = document.getElementById('recipientInput').value || '—';
    const commission = document.getElementById('commissionInput').value || 0;

    if (!amount || Number(amount) <= 0) {
      alert('Введите сумму больше 0');
      return;
    }
    if (!recipient.trim()) {
      alert('Введите получателя');
      return;
    }

    document.getElementById('amountView').textContent = amount + ' ₽';
    document.getElementById('commissionView').textContent = 'Комиссия ' + commission + ' ₽';
    document.getElementById('recipientView').textContent = recipient;

    /* перезапуск анимации галочки */
    const checkPath = document.querySelector('.check path');
    checkPath.style.animation = 'none';
    void checkPath.offsetWidth;
    checkPath.style.animation = '';

    showScreen('screenReceipt');
  }

  function backToForm() {
    showScreen('screenForm');
  }

  function randomRecipient() {
    const el = document.getElementById('recipientInput');
    let next, attempts = 0;
    do {
      next = NAMES[Math.floor(Math.random() * NAMES.length)];
      attempts++;
    } while (next === el.value && NAMES.length > 1 && attempts < 20);
    el.value = next;
  }

  /* ===== Админка ===== */
  function openAdmin() {
    if (isAdmin) {
      document.getElementById('adminModal').classList.add('show');
      return;
    }
    document.getElementById('loginErr').textContent = '';
    document.getElementById('passInput').value = '';
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('passInput').focus(), 60);
  }

  function tryLogin() {
    const val = document.getElementById('passInput').value;
    const err = document.getElementById('loginErr');

    if (!val) {
      err.textContent = 'Введите пароль';
      return;
    }

    if (val === ADMIN_PASSWORD) {
      isAdmin = true;
      err.textContent = '';
      closeModal('loginModal');
      document.getElementById('adminModal').classList.add('show');
    } else {
      err.textContent = 'Неверный пароль';
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  function toggleWatermark() {
    watermarkEnabled = !watermarkEnabled;
    const sw = document.getElementById('wmSwitch');
    sw.classList.toggle('on', watermarkEnabled);
    document.getElementById('watermark')
      .classList.toggle('hidden', !watermarkEnabled);
    document.getElementById('adminMsg').textContent =
      watermarkEnabled ? 'Вотермарка включена' : 'Вотермарка выключена';
  }

  function logout() {
    isAdmin = false;
    closeModal('adminModal');
  }

  /* ===== Скачать PNG ===== */
  async function downloadPNG() {
    const node = document.getElementById('receipt');
    const rect = node.getBoundingClientRect();
    const scale = 3;

    const canvas = document.createElement('canvas');
    canvas.width = rect.width * scale;
    canvas.height = rect.height * scale;

    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    /* фон карточки */
    ctx.fillStyle = '#0d0d0d';
    roundRect(ctx, 0, 0, rect.width, rect.height, 24);
    ctx.fill();

    /* вотермарка */
    if (watermarkEnabled) {
      ctx.save();
      ctx.translate(rect.width / 2, rect.height / 2);
      ctx.rotate(-30 * Math.PI / 180);
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = '#ff2d2d';
      ctx.font = '900 24px Onest, sans-serif';
      ctx.textAlign = 'center';
      for (let y = -rect.height; y < rect.height; y += 80) {
        for (let x = -rect.width; x < rect.width; x += 150) {
          ctx.fillText('ФЕЙК', x, y);
        }
      }
      ctx.restore();
    }

    /* галочка с градиентом */
    const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
    grad.addColorStop(0,    '#c6f542');
    grad.addColorStop(0.25, '#7ee34a');
    grad.addColorStop(0.55, '#22c55e');
    grad.addColorStop(0.80, '#22d3ee');
    grad.addColorStop(1,    '#22b8e8');

    ctx.strokeStyle = grad;
    ctx.lineWidth = 15;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const cx = rect.width / 2;
    const cy = 46 + 55;
    const s = 110 / 100;

    ctx.beginPath();
    ctx.moveTo(cx + (22 - 50) * s, cy + (54 - 50) * s);
    ctx.lineTo(cx + (42 - 50) * s, cy + (74 - 50) * s);
    ctx.lineTo(cx + (80 - 50) * s, cy + (30 - 50) * s);
    ctx.stroke();

    /* тексты */
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    ctx.font = '700 24px Onest, sans-serif';
    ctx.fillText('Перевод доставлен', cx, cy + 80);

    ctx.font = '800 46px Onest, sans-serif';
    ctx.fillText(
      document.getElementById('amountView').textContent,
      cx, cy + 134
    );

    ctx.fillStyle = '#8a8a8a';
    ctx.font = '500 15px Onest, sans-serif';
    ctx.fillText(
      document.getElementById('commissionView').textContent,
      cx, cy + 162
    );

    ctx.fillStyle = '#6b6b6b';
    ctx.fillText(
      document.getElementById('recipientView').textContent,
      cx, cy + 184
    );

    const link = document.createElement('a');
    link.download = 'receipt.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ===== Инициализация ===== */
  document.addEventListener('DOMContentLoaded', () => {
    initWatermark();

    document.getElementById('passInput')
      .addEventListener('keydown', e => {
        if (e.key === 'Enter') tryLogin();
      });

    document.querySelectorAll('.modal-bg').forEach(bg => {
      bg.addEventListener('click', e => {
        if (e.target === bg) bg.classList.remove('show');
      });
    });
  });
</script>

</body>
</html>
